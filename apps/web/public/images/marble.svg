<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- One white marble slab (Carrara-like), drawn by the browser at any screen density: thin diagonal veins
       bent by fractal noise over a faint cloudy ground. Shown fixed behind the page, so it never tiles. -->
  <filter id="flow" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0042" numOctaves="4" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="150" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="0.7"/>
  </filter>
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0022" numOctaves="3" seed="3"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.60  0 0 0 0 0.57  0 0 0 -0.9 0.42"/>
  </filter>
  <rect width="1600" height="1000" fill="#fdfdfc"/>
  <rect width="1600" height="1000" filter="url(#cloud)" opacity="0.14"/>
  <g filter="url(#flow)">
<line x1="-420" y1="-80" x2="340" y2="1080" stroke="#a9a39a" stroke-width="2.0" stroke-opacity="0.2"/>
<line x1="230" y1="-80" x2="990" y2="1080" stroke="#a9a39a" stroke-width="2.0" stroke-opacity="0.2"/>
<line x1="900" y1="-80" x2="1660" y2="1080" stroke="#a9a39a" stroke-width="2.0" stroke-opacity="0.2"/>
<line x1="1420" y1="-80" x2="2180" y2="1080" stroke="#a9a39a" stroke-width="2.0" stroke-opacity="0.2"/>
<line x1="266" y1="-80" x2="1026" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
<line x1="542" y1="-80" x2="1302" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
<line x1="-278" y1="-80" x2="482" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
<line x1="922" y1="-80" x2="1682" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
<line x1="1261" y1="-80" x2="2021" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
<line x1="-66" y1="-80" x2="694" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
<line x1="-331" y1="-80" x2="429" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
<line x1="-428" y1="-80" x2="332" y2="1080" stroke="#bcb7ae" stroke-width="0.9" stroke-opacity="0.12"/>
  </g>
</svg>
